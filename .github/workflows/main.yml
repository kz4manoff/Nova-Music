name: NOVA MUSIC Android CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional semantic version override (e.g., 1.0.2)'
        required: false
        type: string
      release_version_code:
        description: 'Optional integer versionCode override'
        required: false
        type: string
      sync_website_only:
        description: 'Skip Android build and sync Nova-Website public/update.json from the latest published Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nova-music-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.sync_website_only != true }}
    runs-on: ubuntu-latest
    outputs:
      signing_ready: ${{ steps.signing.outputs.ready }}
      should_release: ${{ steps.version.outputs.should_release }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      apk_filename: ${{ steps.package.outputs.apk_filename }}
      apk_version_name: ${{ steps.package.outputs.apk_version_name }}
      apk_version_code: ${{ steps.package.outputs.apk_version_code }}
      sha256: ${{ steps.package.outputs.sha256 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve and validate release version metadata
        id: version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          INPUT_RELEASE_VERSION_CODE: ${{ inputs.release_version_code }}
        run: |
          set -euo pipefail

          IS_TAG=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            IS_TAG=true
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG_NAME#v}"
          elif [[ -n "${INPUT_RELEASE_VERSION}" ]]; then
            VERSION_NAME="${INPUT_RELEASE_VERSION#v}"
            TAG_NAME="v${VERSION_NAME}"
          else
            VERSION_NAME=$(grep -E 'System\.getenv\("NOVA_VERSION_NAME"\)' -A1 app/build.gradle.kts | tail -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            TAG_NAME="v${VERSION_NAME}"
          fi

          if ! [[ "${VERSION_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid versionName '${VERSION_NAME}'. Expected format like 1.0.2 (tag v1.0.2)."
            exit 1
          fi

          GRADLE_CODE=$(grep -E 'System\.getenv\("NOVA_VERSION_CODE"\)' -A1 app/build.gradle.kts | tail -n1 | tr -dc '0-9')
          if [[ -z "${GRADLE_CODE}" ]]; then
            echo "::error::Could not resolve fallback versionCode from app/build.gradle.kts."
            exit 1
          fi

          if [[ -n "${INPUT_RELEASE_VERSION_CODE}" ]]; then
            if ! [[ "${INPUT_RELEASE_VERSION_CODE}" =~ ^[0-9]+$ ]]; then
              echo "::error::Invalid release_version_code '${INPUT_RELEASE_VERSION_CODE}'. Must be an integer."
              exit 1
            fi
            VERSION_CODE="${INPUT_RELEASE_VERSION_CODE}"
          else
            VERSION_CODE="${GRADLE_CODE}"
          fi

          RELEASES_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" || echo "[]")

          read -r MAX_PUBLISHED_CODE RELEASE_EXISTS < <(TAG_NAME="${TAG_NAME}" python3 -c '
          import json, os, re, sys
          releases = json.loads(sys.stdin.read() or "[]")
          target_tag = os.environ["TAG_NAME"]
          max_code = 0
          release_exists = False
          for rel in releases:
              if rel.get("draft"):
                  continue
              if rel.get("tag_name") == target_tag:
                  release_exists = True
              body = rel.get("body") or ""
              for pat in [r"\"versionCode\"\s*:\s*(\d+)", r"Build\s+(\d+)", r"versionCode\s*[:=]\s*(\d+)"]:
                  for m in re.findall(pat, body):
                      max_code = max(max_code, int(m))
          print(f"{max_code} {str(release_exists).lower()}")
          ' <<< "${RELEASES_JSON}")

          TAG_EXISTS=false
          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            TAG_EXISTS=true
          fi

          SHOULD_RELEASE=false
          if [[ "${IS_TAG}" == "true" ]]; then
            if [[ "${RELEASE_EXISTS}" == "true" ]]; then
              echo "::error::GitHub Release '${TAG_NAME}' already exists. Refusing to overwrite a published release."
              exit 1
            fi
            if (( VERSION_CODE <= MAX_PUBLISHED_CODE )); then
              echo "::error::versionCode ${VERSION_CODE} is not greater than highest published versionCode (${MAX_PUBLISHED_CODE}). Bump versionCode in app/build.gradle.kts."
              exit 1
            fi
            SHOULD_RELEASE=true
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${TAG_EXISTS}" == "true" || "${RELEASE_EXISTS}" == "true" ]]; then
              echo "::error::Tag/Release '${TAG_NAME}' already exists. Bump versionName and versionCode before triggering a release."
              exit 1
            fi
            if (( VERSION_CODE <= MAX_PUBLISHED_CODE )); then
              echo "::error::versionCode ${VERSION_CODE} is not greater than highest published versionCode (${MAX_PUBLISHED_CODE})."
              exit 1
            fi
            SHOULD_RELEASE=true
          else
            if [[ "${TAG_EXISTS}" == "false" && "${RELEASE_EXISTS}" == "false" ]] && (( VERSION_CODE > MAX_PUBLISHED_CODE )); then
              SHOULD_RELEASE=true
            else
              echo "::warning::Skipping GitHub Release creation on push to main: tag '${TAG_NAME}' exists=${TAG_EXISTS}, release exists=${RELEASE_EXISTS}, versionCode=${VERSION_CODE}, max_published=${MAX_PUBLISHED_CODE}. Bump versionName and versionCode to publish a new release."
            fi
          fi

          echo "is_tag=${IS_TAG}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "max_published_code=${MAX_PUBLISHED_CODE}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"

          echo "Resolved NOVA MUSIC ${TAG_NAME} (versionName=${VERSION_NAME}, versionCode=${VERSION_CODE}, maxPublished=${MAX_PUBLISHED_CODE}, shouldRelease=${SHOULD_RELEASE})"

      - name: Validate release signing secrets
        id: signing
        shell: bash
        env:
          IS_TAG_BUILD: ${{ steps.version.outputs.is_tag }}
          SHOULD_RELEASE: ${{ steps.version.outputs.should_release }}
          HAS_KEYSTORE: ${{ secrets.NOVA_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASS: ${{ secrets.NOVA_KEYSTORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS != '' }}
          HAS_KEY_PASS: ${{ secrets.NOVA_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          MISSING=()
          [[ "${HAS_KEYSTORE}" != "true" ]] && MISSING+=("NOVA_KEYSTORE_BASE64")
          [[ "${HAS_STORE_PASS}" != "true" ]] && MISSING+=("NOVA_KEYSTORE_PASSWORD")
          [[ "${HAS_KEY_ALIAS}" != "true" ]] && MISSING+=("NOVA_KEY_ALIAS")
          [[ "${HAS_KEY_PASS}" != "true" ]] && MISSING+=("NOVA_KEY_PASSWORD")

          if (( ${#MISSING[@]} > 0 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            MSG="Missing required release signing secret(s): ${MISSING[*]}. Configure all 4 secrets in GitHub Repository Settings -> Secrets and variables -> Actions. Unsigned APKs cannot be installed on Android devices."
            {
              echo "### Missing Release Signing Secrets"
              echo "Android refuses to install unsigned APKs. Configure all 4 repository secrets under **Settings → Secrets and variables → Actions** before building a release APK:"
              echo "- \`NOVA_KEYSTORE_BASE64\`"
              echo "- \`NOVA_KEYSTORE_PASSWORD\`"
              echo "- \`NOVA_KEY_ALIAS\`"
              echo "- \`NOVA_KEY_PASSWORD\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${MSG}"
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode & verify production keystore
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          NOVA_KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${GITHUB_WORKSPACE}/nova-release.jks"
          export NOVA_KEYSTORE_PATH="${KEYSTORE_PATH}"

          python3 - <<'PYEOF'
          import base64
          import binascii
          import os
          import re
          import sys

          def fail(msg: str) -> None:
              print(f"::error::{msg}", file=sys.stderr)
              sys.exit(1)

          def normalize_b64(text: str) -> str:
              s = text.strip()
              if len(s) >= 2 and s[0] == s[-1] and s[0] in ('"', "'"):
                  s = s[1:-1].strip()
              if "-----BEGIN" in s and "-----END" in s:
                  lines = [
                      ln.strip()
                      for ln in s.splitlines()
                      if ln.strip() and not ln.strip().startswith("-----")
                  ]
                  s = "".join(lines)
              if s.startswith("data:") and ";base64," in s[:128]:
                  s = s.split(";base64,", 1)[1]
              s = re.sub(r"\s+", "", s)
              if not s:
                  fail("NOVA_KEYSTORE_BASE64 secret is empty after trimming whitespace.")
              if ("-" in s or "_" in s) and "+" not in s and "/" not in s:
                  s = s.replace("-", "+").replace("_", "/")
              if len(s) % 4 == 1:
                  fail(
                      f"NOVA_KEYSTORE_BASE64 has invalid Base64 length ({len(s)} chars; truncated paste)."
                  )
              if len(s) % 4 != 0:
                  s += "=" * (4 - (len(s) % 4))
              return s

          def is_keystore_header(data: bytes) -> bool:
              if len(data) < 128:
                  return False
              # JKS magic: 0xFEEDFEED, PKCS12 DER SEQUENCE: 0x30
              return data[:4] == b"\xfe\xed\xfe\xed" or data[0:1] == b"\x30"

          def diagnose_bytes(data: bytes) -> str:
              n = len(data)
              hdr = data[:4].hex() if n >= 4 else data.hex()
              if n == 0:
                  return "decoded to 0 bytes"
              if data.lstrip().startswith(b"-----BEGIN"):
                  return "decoded bytes are PEM text (not a binary .jks or .p12 keystore)"
              if data[:2] in (b"\xff\xfe", b"\xfe\xff") or (n >= 16 and data[1:16:2] == b"\x00" * 7):
                  return "decoded bytes look like UTF-16 text (likely created with PowerShell redirection instead of raw file bytes)"
              if data[:2] == b"\x1f\x8b":
                  return "decoded bytes start with gzip header (0x1f8b), not a raw .jks or .p12 keystore"
              if data[:4] == b"PK\x03\x04":
                  return "decoded bytes start with ZIP/APK header (0x504b0304), not a raw .jks or .p12 keystore"
              sample = data[:min(n, 64)]
              if all(b in b"\t\r\n" or 32 <= b <= 126 for b in sample):
                  return f"decoded bytes are plain ASCII text ({n} bytes, magic=0x{hdr}), not a binary .jks or .p12 keystore"
              if n < 128:
                  return f"decoded to only {n} bytes (magic=0x{hdr}); truncated or wrong secret"
              return f"unexpected binary header 0x{hdr} ({n} bytes); expected JKS (0xfeedfeed) or PKCS12 DER (0x30...)"

          raw = os.environ.get("NOVA_KEYSTORE_BASE64", "")
          try:
              data = base64.b64decode(normalize_b64(raw), validate=True)
          except binascii.Error as exc:
              fail(
                  f"NOVA_KEYSTORE_BASE64 is not valid Base64 ({exc}). Re-encode your .jks/.p12 keystore cleanly as single-line Base64 without edits or truncation."
              )

          if not is_keystore_header(data):
              candidate = data
              if candidate.startswith(b"\xef\xbb\xbf"):
                  candidate = candidate[3:]
              try:
                  inner_text = candidate.decode("ascii")
                  inner_data = base64.b64decode(normalize_b64(inner_text), validate=True)
                  if is_keystore_header(inner_data):
                      print("::warning::NOVA_KEYSTORE_BASE64 was double-base64 encoded; automatically unwrapped inner keystore bytes.")
                      data = inner_data
              except Exception:
                  pass

          if not is_keystore_header(data):
              reason = diagnose_bytes(data)
              fail(
                  f"Decoded NOVA_KEYSTORE_BASE64 is not a valid Android keystore ({reason}). Re-encode your original .jks/.p12 file cleanly (for example: base64 -w 0 nova-release.jks) and update the NOVA_KEYSTORE_BASE64 repository secret."
              )

          out_path = os.environ["NOVA_KEYSTORE_PATH"]
          with open(out_path, "wb") as f:
              f.write(data)
          os.chmod(out_path, 0o600)
          fmt = "JKS" if data[:4] == b"\xfe\xed\xfe\xed" else "PKCS12/DER"
          print(f"Decoded {len(data)} bytes ({fmt} header verified).")
          PYEOF

          VERIFY_DIR=$(mktemp -d)
          trap 'rm -rf "${VERIFY_DIR}"' EXIT
          cat <<'JAVA' > "${VERIFY_DIR}/VerifyKeystore.java"
          import java.io.File;
          import java.io.IOException;
          import java.security.Key;
          import java.security.KeyStore;
          import java.security.UnrecoverableKeyException;
          import java.security.cert.Certificate;

          public class VerifyKeystore {
              public static void main(String[] args) {
                  String path = System.getenv("NOVA_KEYSTORE_PATH");
                  String storePassEnv = System.getenv("NOVA_KEYSTORE_PASSWORD");
                  String alias = System.getenv("NOVA_KEY_ALIAS");
                  String keyPassEnv = System.getenv("NOVA_KEY_PASSWORD");
                  char[] storePass = storePassEnv != null ? storePassEnv.toCharArray() : new char[0];
                  char[] keyPass = keyPassEnv != null ? keyPassEnv.toCharArray() : new char[0];

                  KeyStore ks;
                  try {
                      ks = KeyStore.getInstance(new File(path), storePass);
                  } catch (IOException e) {
                      String msg = e.getMessage() != null ? e.getMessage() : e.toString();
                      String lower = msg.toLowerCase();
                      Throwable cause = e.getCause();
                      if (cause instanceof UnrecoverableKeyException || lower.contains("password") || lower.contains("tampered")) {
                          System.err.println("::error::Failed to unlock keystore with NOVA_KEYSTORE_PASSWORD (" + msg + "). Check that NOVA_KEYSTORE_PASSWORD matches your keystore store password.");
                      } else {
                          System.err.println("::error::Keystore file from NOVA_KEYSTORE_BASE64 is corrupted or unreadable (" + msg + "). Re-encode your .jks/.p12 file cleanly and update NOVA_KEYSTORE_BASE64.");
                      }
                      System.exit(1);
                      return;
                  } catch (Exception e) {
                      System.err.println("::error::Failed to load keystore (" + e.getClass().getSimpleName() + ": " + e.getMessage() + ").");
                      System.exit(1);
                      return;
                  }

                  try {
                      if (!ks.containsAlias(alias)) {
                          System.err.println("::error::Key alias configured in NOVA_KEY_ALIAS was not found in the keystore (total entries: " + ks.size() + "). Verify NOVA_KEY_ALIAS matches the exact key alias inside your keystore.");
                          System.exit(1);
                      }
                      if (!ks.isKeyEntry(alias)) {
                          System.err.println("::error::The entry matching NOVA_KEY_ALIAS is not a private key entry (it may be a public certificate only). Ensure your keystore contains the private key.");
                          System.exit(1);
                      }
                      Key key = ks.getKey(alias, keyPass);
                      Certificate cert = ks.getCertificate(alias);
                      if (key == null || cert == null) {
                          System.err.println("::error::Could not recover private key or certificate for NOVA_KEY_ALIAS.");
                          System.exit(1);
                      }
                      System.out.println("Verified keystore (type=" + ks.getType() + ", entries=" + ks.size() + ", keyAlgorithm=" + key.getAlgorithm() + ").");
                  } catch (UnrecoverableKeyException e) {
                      System.err.println("::error::NOVA_KEY_PASSWORD could not decrypt the private key for NOVA_KEY_ALIAS. Verify NOVA_KEY_PASSWORD matches the key password.");
                      System.exit(1);
                  } catch (Exception e) {
                      System.err.println("::error::Failed while verifying key entry (" + e.getClass().getSimpleName() + ": " + e.getMessage() + ").");
                      System.exit(1);
                  }
              }
          }
          JAVA
          java "${VERIFY_DIR}/VerifyKeystore.java"

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build signed Release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          NOVA_KEYSTORE_PATH: nova-release.jks
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
          NOVA_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          NOVA_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify signed Release APK, metadata & SHA-256
        id: package
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          OUT_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          OUT_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail

          APK_SOURCE=$(find app/build/outputs/apk/release -maxdepth 2 -name "*.apk" ! -name "*unsigned*" ! -name "*debug*" | head -n 1)
          if [[ -z "${APK_SOURCE}" || ! -f "${APK_SOURCE}" || ! -s "${APK_SOURCE}" ]]; then
            echo "::error::Signed release APK was not produced in app/build/outputs/apk/release. Refusing to continue."
            exit 1
          fi
          echo "Verified Gradle Release APK output path: ${APK_SOURCE}"

          unzip -t "${APK_SOURCE}" >/dev/null

          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [[ -z "${APKSIGNER}" ]]; then
            echo "::error::apksigner not found in ANDROID_HOME/build-tools."
            exit 1
          fi
          "${APKSIGNER}" verify --min-sdk-version 26 --print-certs "${APK_SOURCE}"

          APK_VERSION_NAME="${OUT_VERSION_NAME}"
          APK_VERSION_CODE="${OUT_VERSION_CODE}"
          AAPT2=$(find "${ANDROID_HOME}/build-tools" -name "aapt2" | sort -V | tail -n 1)
          if [[ -n "${AAPT2}" ]]; then
            BADGING=$("${AAPT2}" dump badging "${APK_SOURCE}")
            echo "${BADGING}" | head -n 8
            if ! grep -q "package: name='com.novamusic.player'" <<< "${BADGING}"; then
              echo "::error::APK package name is not com.novamusic.player."
              exit 1
            fi
            if ! grep -qE "(^|[[:space:]])versionCode='${OUT_VERSION_CODE}'([[:space:]]|$)" <<< "${BADGING}"; then
              echo "::error::APK versionCode does not match expected ${OUT_VERSION_CODE}."
              exit 1
            fi
            if ! grep -qE "(^|[[:space:]])versionName='${OUT_VERSION_NAME}'([[:space:]]|$)" <<< "${BADGING}"; then
              echo "::error::APK versionName does not match expected ${OUT_VERSION_NAME}."
              exit 1
            fi
            if ! grep -qE "(^|[[:space:]])(minSdkVersion|sdkVersion):'26'([[:space:]]|$)" <<< "${BADGING}"; then
              echo "::error::APK minSdkVersion is not 26."
              exit 1
            fi
            if ! grep -qE "(^|[[:space:]])targetSdkVersion:'35'([[:space:]]|$)" <<< "${BADGING}"; then
              echo "::error::APK targetSdkVersion is not 35."
              exit 1
            fi
            if grep -q "application-debuggable" <<< "${BADGING}"; then
              echo "::error::APK is marked debuggable! Refusing to publish a debuggable APK as a release."
              exit 1
            fi
            if grep -q "testOnly='-1'" <<< "${BADGING}"; then
              echo "::error::APK is marked testOnly! Refusing to publish an un-installable testOnly APK."
              exit 1
            fi
            APK_VERSION_CODE=$(sed -nE "s/.*[[:space:]]versionCode='([0-9]+)'.*/\1/p" <<< "${BADGING}" | head -n 1)
            APK_VERSION_NAME=$(sed -nE "s/.*[[:space:]]versionName='([^']+)'.*/\1/p" <<< "${BADGING}" | head -n 1)
          fi

          APK_FILENAME="NOVA-MUSIC-v${APK_VERSION_NAME}.apk"
          mkdir -p release-artifacts
          cp "${APK_SOURCE}" "release-artifacts/${APK_FILENAME}"

          SHA256=$(sha256sum "release-artifacts/${APK_FILENAME}" | awk '{print $1}')
          printf '%s  %s\n' "${SHA256}" "${APK_FILENAME}" > "release-artifacts/${APK_FILENAME}.sha256"
          (cd release-artifacts && sha256sum -c "${APK_FILENAME}.sha256")

          echo "apk_filename=${APK_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "apk_version_name=${APK_VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_version_code=${APK_VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

          {
            echo "### Signed Release Artifact Verified"
            echo "- **APK File**: \`${APK_FILENAME}\`"
            echo "- **Gradle Output**: \`${APK_SOURCE}\`"
            echo "- **Version**: \`${APK_VERSION_NAME}\` (\`versionCode: ${APK_VERSION_CODE}\`)"
            echo "- **SHA-256**: \`${SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup keystore from runner
        if: always()
        shell: bash
        run: rm -f "${GITHUB_WORKSPACE}/nova-release.jks"

      - name: Upload signed Release APK artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-MUSIC-release-v${{ steps.version.outputs.version_name }}
          path: |
            release-artifacts/${{ steps.package.outputs.apk_filename }}
            release-artifacts/${{ steps.package.outputs.apk_filename }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.signing.outputs.ready == 'true' && steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: NOVA MUSIC ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-artifacts/${{ steps.package.outputs.apk_filename }}
            release-artifacts/${{ steps.package.outputs.apk_filename }}.sha256
          body: |
            ## NOVA MUSIC ${{ steps.version.outputs.tag_name }} (Build ${{ steps.version.outputs.version_code }})

            ### Integrity Verification
            - **APK File**: `${{ steps.package.outputs.apk_filename }}`
            - **SHA-256**: `${{ steps.package.outputs.sha256 }}`
            - **Direct Download**: `https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag_name }}/${{ steps.package.outputs.apk_filename }}`

            ### Website (`kz4manoff/Nova-Website`) `public/update.json` Configuration
            ```json
            {
              "latestVersion": "${{ steps.version.outputs.version_name }}",
              "versionCode": ${{ steps.version.outputs.version_code }},
              "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag_name }}/${{ steps.package.outputs.apk_filename }}",
              "sha256": "${{ steps.package.outputs.sha256 }}",
              "releaseNotes": "See GitHub Release notes for NOVA MUSIC ${{ steps.version.outputs.tag_name }}.",
              "mandatoryUpdate": false,
              "minimumSupportedVersion": 1
            }
            ```

      - name: Verify published GitHub Release contains APK and SHA-256
        id: verify_release
        if: steps.signing.outputs.ready == 'true' && steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          APK_FILENAME: ${{ steps.package.outputs.apk_filename }}
        run: |
          set -euo pipefail
          REL_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}")

          APK_URL=$(python3 -c '
          import json, os, sys
          rel = json.loads(sys.stdin.read())
          assert not rel.get("draft"), "Published release must not be a draft."
          apk_name = os.environ["APK_FILENAME"]
          sha_name = apk_name + ".sha256"
          assets = {a["name"]: a for a in rel.get("assets", [])}
          assert apk_name in assets and assets[apk_name]["size"] > 0, f"Missing APK asset {apk_name}"
          assert sha_name in assets and assets[sha_name]["size"] > 0, f"Missing SHA-256 asset {sha_name}"
          print(assets[apk_name]["browser_download_url"])
          ' <<< "${REL_JSON}")

          echo "apk_url=${APK_URL}" >> "$GITHUB_OUTPUT"
          echo "Verified Public APK URL: ${APK_URL}"

  sync-website:
    needs: [test-and-build]
    if: ${{ always() && ((github.event_name == 'workflow_dispatch' && inputs.sync_website_only == true) || (needs.test-and-build.result == 'success' && needs.test-and-build.outputs.signing_ready == 'true' && needs.test-and-build.outputs.should_release == 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate NOVA_WEBSITE_TOKEN secret
        shell: bash
        env:
          HAS_WEBSITE_TOKEN: ${{ secrets.NOVA_WEBSITE_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [[ "${HAS_WEBSITE_TOKEN}" != "true" ]]; then
            echo "::error::Missing required GitHub Actions secret NOVA_WEBSITE_TOKEN. Create a Fine-grained Personal Access Token with Contents: Read and write permission on kz4manoff/Nova-Website and save it in kz4manoff/Nova-Music -> Settings -> Secrets and variables -> Actions -> NOVA_WEBSITE_TOKEN. The published Android APK Release remains valid."
            {
              echo "### Website Manifest Sync Failed"
              echo "The signed Android APK Release was published cleanly and remains valid, but website synchronization failed because the \`NOVA_WEBSITE_TOKEN\` repository secret is missing."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Inspect published GitHub Release APK & compute SHA-256
        id: release_apk
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TAG: ${{ needs.test-and-build.outputs.tag_name }}
          EXPECTED_APK_FILENAME: ${{ needs.test-and-build.outputs.apk_filename }}
          FALLBACK_VERSION_NAME: ${{ needs.test-and-build.outputs.apk_version_name }}
          FALLBACK_VERSION_CODE: ${{ needs.test-and-build.outputs.apk_version_code }}
          EXPECTED_SHA256: ${{ needs.test-and-build.outputs.sha256 }}
        run: |
          set -euo pipefail

          if [[ -n "${TARGET_TAG}" ]]; then
            RELEASE_API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TARGET_TAG}"
          else
            RELEASE_API="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          fi

          REL_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${RELEASE_API}")

          read -r REL_TAG APK_NAME APK_URL < <(python3 -c '
          import json, os, sys
          rel = json.loads(sys.stdin.read())
          assert not rel.get("draft"), "Published GitHub Release must not be a draft."
          expected_name = os.environ.get("EXPECTED_APK_FILENAME", "").strip()
          assets = rel.get("assets", [])
          apk_asset = None
          if expected_name:
              apk_asset = next((a for a in assets if a["name"] == expected_name and a["size"] > 0), None)
          if apk_asset is None:
              apk_asset = next(
                  (
                      a for a in assets
                      if a["name"].lower().endswith(".apk")
                      and "unsigned" not in a["name"].lower()
                      and a["size"] > 0
                  ),
                  None,
              )
          assert apk_asset is not None, "No valid .apk asset found in published GitHub Release."
          print(rel["tag_name"], apk_asset["name"], apk_asset["browser_download_url"])
          ' <<< "${REL_JSON}")

          TMP_APK=$(mktemp /tmp/nova-published-XXXXXX.apk)
          trap 'rm -f "${TMP_APK}"' EXIT
          curl -fsSL -L -o "${TMP_APK}" "${APK_URL}"

          ACTUAL_SHA256=$(sha256sum "${TMP_APK}" | awk '{print $1}')
          if [[ -n "${EXPECTED_SHA256}" && "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]]; then
            echo "::error::Published APK SHA-256 (${ACTUAL_SHA256}) does not match built release APK SHA-256 (${EXPECTED_SHA256})."
            exit 1
          fi

          APK_VERSION_NAME="${FALLBACK_VERSION_NAME}"
          APK_VERSION_CODE="${FALLBACK_VERSION_CODE}"
          AAPT2=""
          if [[ -n "${ANDROID_HOME:-}" && -d "${ANDROID_HOME}/build-tools" ]]; then
            AAPT2=$(find "${ANDROID_HOME}/build-tools" -name "aapt2" | sort -V | tail -n 1 || true)
          fi

          if [[ -n "${AAPT2}" ]]; then
            BADGING=$("${AAPT2}" dump badging "${TMP_APK}")
            if ! grep -q "package: name='com.novamusic.player'" <<< "${BADGING}"; then
              echo "::error::Published APK package name is not com.novamusic.player."
              exit 1
            fi
            APK_VERSION_CODE=$(sed -nE "s/.*[[:space:]]versionCode='([0-9]+)'.*/\1/p" <<< "${BADGING}" | head -n 1)
            APK_VERSION_NAME=$(sed -nE "s/.*[[:space:]]versionName='([^']+)'.*/\1/p" <<< "${BADGING}" | head -n 1)
          else
            if [[ -z "${APK_VERSION_NAME}" ]]; then
              APK_VERSION_NAME="${REL_TAG#v}"
              APK_VERSION_NAME="${APK_VERSION_NAME#V}"
            fi
            if [[ -z "${APK_VERSION_CODE}" ]]; then
              APK_VERSION_CODE=$(python3 -c '
          import json, re, sys
          body = json.loads(sys.stdin.read()).get("body") or ""
          for pat in [r"\"versionCode\"\s*:\s*(\d+)", r"Build\s+(\d+)"]:
              m = re.search(pat, body)
              if m:
                  print(m.group(1))
                  sys.exit(0)
          sys.exit(1)
          ' <<< "${REL_JSON}" || true)
            fi
          fi

          if [[ -z "${APK_VERSION_NAME}" || ! "${APK_VERSION_CODE}" =~ ^[0-9]+$ || "${APK_VERSION_CODE}" -le 0 ]]; then
            echo "::error::Could not determine valid versionName/versionCode from published APK ${APK_NAME}."
            exit 1
          fi

          echo "tag_name=${REL_TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_url=${APK_URL}" >> "$GITHUB_OUTPUT"
          echo "version_name=${APK_VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${APK_VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "sha256=${ACTUAL_SHA256}" >> "$GITHUB_OUTPUT"

          echo "Verified published GitHub Release ${REL_TAG}: ${APK_NAME} (versionName=${APK_VERSION_NAME}, versionCode=${APK_VERSION_CODE}, sha256=${ACTUAL_SHA256})"
          echo "Exact APK URL: ${APK_URL}"

      - name: Push update.json to kz4manoff/Nova-Website
        shell: bash
        env:
          NOVA_WEBSITE_TOKEN: ${{ secrets.NOVA_WEBSITE_TOKEN }}
          VERSION_NAME: ${{ steps.release_apk.outputs.version_name }}
          VERSION_CODE: ${{ steps.release_apk.outputs.version_code }}
          APK_URL: ${{ steps.release_apk.outputs.apk_url }}
          SHA256: ${{ steps.release_apk.outputs.sha256 }}
          WEBSITE_REPO: kz4manoff/Nova-Website
          WEBSITE_PATH: public/update.json
          WEBSITE_BRANCH: main
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/${WEBSITE_REPO}/contents/${WEBSITE_PATH}"
          GET_RESP=$(mktemp)
          PUT_RESP=$(mktemp)
          PAYLOAD_FILE=$(mktemp)
          trap 'rm -f "${GET_RESP}" "${PUT_RESP}" "${PAYLOAD_FILE}"' EXIT

          HTTP_CODE=$(curl -sS -o "${GET_RESP}" -w "%{http_code}" \
            -H "Authorization: Bearer ${NOVA_WEBSITE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API_URL}?ref=${WEBSITE_BRANCH}")

          if [[ "${HTTP_CODE}" == "401" || "${HTTP_CODE}" == "403" ]]; then
            echo "::error::NOVA_WEBSITE_TOKEN was rejected by GitHub API (HTTP ${HTTP_CODE}) when reading ${WEBSITE_REPO}/${WEBSITE_PATH}. Ensure it is valid and has Contents: Read and write permission on ${WEBSITE_REPO}. The published APK Release remains intact."
            exit 1
          elif [[ "${HTTP_CODE}" != "200" && "${HTTP_CODE}" != "404" ]]; then
            echo "::error::Failed to fetch ${WEBSITE_REPO}/${WEBSITE_PATH} (HTTP ${HTTP_CODE}). The published APK Release remains intact."
            exit 1
          fi

          SYNC_STATUS=$(HTTP_CODE="${HTTP_CODE}" python3 - "${GET_RESP}" "${PAYLOAD_FILE}" <<'PYEOF'
          import base64, json, os, sys

          http_code = os.environ["HTTP_CODE"]
          file_sha = None
          existing_raw = ""
          existing = {}
          if http_code == "200":
              with open(sys.argv[1], "r", encoding="utf-8") as f:
                  meta = json.load(f)
              file_sha = meta["sha"]
              if meta.get("content"):
                  existing_raw = base64.b64decode(meta["content"]).decode("utf-8")
                  try:
                      parsed = json.loads(existing_raw)
                      if isinstance(parsed, dict):
                          existing = parsed
                  except Exception:
                      existing = {}

          version_name = os.environ["VERSION_NAME"]
          version_code = int(os.environ["VERSION_CODE"])
          manifest = {
              "latestVersion": version_name,
              "versionCode": version_code,
              "apkUrl": os.environ["APK_URL"],
              "sha256": os.environ["SHA256"],
              "releaseNotes": f"NOVA MUSIC v{version_name} (Build {version_code}) signed release.",
              "mandatoryUpdate": bool(existing.get("mandatoryUpdate", False)),
              "minimumSupportedVersion": int(existing.get("minimumSupportedVersion", 1)),
          }
          formatted = json.dumps(manifest, indent=2) + "\n"

          if existing == manifest and existing_raw == formatted:
              print("NO_CHANGE")
              sys.exit(0)

          body = {
              "message": f"chore: update update.json to v{version_name} (versionCode {version_code})",
              "content": base64.b64encode(formatted.encode("utf-8")).decode("ascii"),
              "branch": os.environ["WEBSITE_BRANCH"],
          }
          if file_sha:
              body["sha"] = file_sha

          with open(sys.argv[2], "w", encoding="utf-8") as out:
              json.dump(body, out)
          print("UPDATE_REQUIRED")
          PYEOF
          )

          if [[ "${SYNC_STATUS}" == "NO_CHANGE" ]]; then
            echo "Website manifest is already synchronized: ${WEBSITE_REPO}/${WEBSITE_PATH} -> v${VERSION_NAME} (versionCode ${VERSION_CODE})."
            {
              echo "### Website Update Manifest Already Up To Date"
              echo "- **Version**: \`v${VERSION_NAME}\` (\`versionCode: ${VERSION_CODE}\`)"
              echo "- **APK URL**: \`${APK_URL}\`"
              echo "- **SHA-256**: \`${SHA256}\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          PUT_CODE=$(curl -sS -o "${PUT_RESP}" -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer ${NOVA_WEBSITE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d @"${PAYLOAD_FILE}" \
            "${API_URL}")

          if [[ "${PUT_CODE}" != "200" && "${PUT_CODE}" != "201" ]]; then
            echo "::error::Failed to commit ${WEBSITE_PATH} to ${WEBSITE_REPO} (HTTP ${PUT_CODE}). Check NOVA_WEBSITE_TOKEN Contents write permissions. The published APK Release remains intact."
            exit 1
          fi

          COMMIT_SHA=$(python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("commit",{}).get("sha","unknown"))' < "${PUT_RESP}")
          echo "Website manifest successfully updated: ${WEBSITE_REPO}/${WEBSITE_PATH}"
          echo "Synced Version: v${VERSION_NAME} (versionCode ${VERSION_CODE})"
          echo "Synced APK URL: ${APK_URL}"
          echo "Synced SHA-256: ${SHA256}"
          echo "Website Commit SHA: ${COMMIT_SHA}"
          echo "Cloudflare Pages deployment triggered automatically by push to ${WEBSITE_REPO}:${WEBSITE_BRANCH}."

          {
            echo "### Website Update Manifest Synced"
            echo "- **Repository**: \`${WEBSITE_REPO}\` (\`${WEBSITE_BRANCH}\`)"
            echo "- **Synced Version**: \`v${VERSION_NAME}\` (\`versionCode: ${VERSION_CODE}\`)"
            echo "- **APK URL**: \`${APK_URL}\`"
            echo "- **SHA-256**: \`${SHA256}\`"
            echo "- **Commit SHA**: \`${COMMIT_SHA}\`"
            echo "- **Deployment**: Cloudflare Pages builds automatically from the \`${WEBSITE_BRANCH}\` commit (\`https://nova-website-1tg.pages.dev/update.json\`)."
          } >> "$GITHUB_STEP_SUMMARY"
