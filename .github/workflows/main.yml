name: NOVA MUSIC Android CI & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Optional semantic version override (e.g., 1.0.2)'
        required: false
        type: string
      release_version_code:
        description: 'Optional integer versionCode override'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: nova-music-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve and validate release version metadata
        id: version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_RELEASE_VERSION: ${{ inputs.release_version }}
          INPUT_RELEASE_VERSION_CODE: ${{ inputs.release_version_code }}
        run: |
          set -euo pipefail

          IS_TAG=false
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            IS_TAG=true
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION_NAME="${TAG_NAME#v}"
          elif [[ -n "${INPUT_RELEASE_VERSION}" ]]; then
            VERSION_NAME="${INPUT_RELEASE_VERSION#v}"
            TAG_NAME="v${VERSION_NAME}"
          else
            VERSION_NAME=$(grep -E 'System\.getenv\("NOVA_VERSION_NAME"\)' -A1 app/build.gradle.kts | tail -n1 | sed -E 's/.*"([^"]+)".*/\1/')
            TAG_NAME="v${VERSION_NAME}"
          fi

          if ! [[ "${VERSION_NAME}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid versionName '${VERSION_NAME}'. Expected format like 1.0.2 (tag v1.0.2)."
            exit 1
          fi

          GRADLE_CODE=$(grep -E 'System\.getenv\("NOVA_VERSION_CODE"\)' -A1 app/build.gradle.kts | tail -n1 | tr -dc '0-9')
          if [[ -z "${GRADLE_CODE}" ]]; then
            echo "::error::Could not resolve fallback versionCode from app/build.gradle.kts."
            exit 1
          fi

          if [[ -n "${INPUT_RELEASE_VERSION_CODE}" ]]; then
            if ! [[ "${INPUT_RELEASE_VERSION_CODE}" =~ ^[0-9]+$ ]]; then
              echo "::error::Invalid release_version_code '${INPUT_RELEASE_VERSION_CODE}'. Must be an integer."
              exit 1
            fi
            VERSION_CODE="${INPUT_RELEASE_VERSION_CODE}"
          else
            VERSION_CODE="${GRADLE_CODE}"
          fi

          RELEASES_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100" || echo "[]")

          read -r MAX_PUBLISHED_CODE RELEASE_EXISTS < <(TAG_NAME="${TAG_NAME}" python3 -c '
          import json, os, re, sys
          releases = json.loads(sys.stdin.read() or "[]")
          target_tag = os.environ["TAG_NAME"]
          max_code = 0
          release_exists = False
          for rel in releases:
              if rel.get("draft"):
                  continue
              if rel.get("tag_name") == target_tag:
                  release_exists = True
              body = rel.get("body") or ""
              for pat in [r"\"versionCode\"\s*:\s*(\d+)", r"Build\s+(\d+)", r"versionCode\s*[:=]\s*(\d+)"]:
                  for m in re.findall(pat, body):
                      max_code = max(max_code, int(m))
          print(f"{max_code} {str(release_exists).lower()}")
          ' <<< "${RELEASES_JSON}")

          TAG_EXISTS=false
          if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
            TAG_EXISTS=true
          fi

          SHOULD_RELEASE=false
          if [[ "${IS_TAG}" == "true" ]]; then
            if [[ "${RELEASE_EXISTS}" == "true" ]]; then
              echo "::error::GitHub Release '${TAG_NAME}' already exists. Refusing to overwrite a published release."
              exit 1
            fi
            if (( VERSION_CODE <= MAX_PUBLISHED_CODE )); then
              echo "::error::versionCode ${VERSION_CODE} is not greater than highest published versionCode (${MAX_PUBLISHED_CODE}). Bump versionCode in app/build.gradle.kts."
              exit 1
            fi
            SHOULD_RELEASE=true
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${TAG_EXISTS}" == "true" || "${RELEASE_EXISTS}" == "true" ]]; then
              echo "::error::Tag/Release '${TAG_NAME}' already exists. Bump versionName and versionCode before triggering a release."
              exit 1
            fi
            if (( VERSION_CODE <= MAX_PUBLISHED_CODE )); then
              echo "::error::versionCode ${VERSION_CODE} is not greater than highest published versionCode (${MAX_PUBLISHED_CODE})."
              exit 1
            fi
            SHOULD_RELEASE=true
          else
            if [[ "${TAG_EXISTS}" == "false" && "${RELEASE_EXISTS}" == "false" ]] && (( VERSION_CODE > MAX_PUBLISHED_CODE )); then
              SHOULD_RELEASE=true
            else
              echo "::warning::Skipping GitHub Release creation on push to main: tag '${TAG_NAME}' exists=${TAG_EXISTS}, release exists=${RELEASE_EXISTS}, versionCode=${VERSION_CODE}, max_published=${MAX_PUBLISHED_CODE}. Bump versionName and versionCode to publish a new release."
            fi
          fi

          echo "is_tag=${IS_TAG}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "max_published_code=${MAX_PUBLISHED_CODE}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"

          echo "Resolved NOVA MUSIC ${TAG_NAME} (versionName=${VERSION_NAME}, versionCode=${VERSION_CODE}, maxPublished=${MAX_PUBLISHED_CODE}, shouldRelease=${SHOULD_RELEASE})"

      - name: Run Android Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Validate release signing secrets
        id: signing
        shell: bash
        env:
          IS_TAG_BUILD: ${{ steps.version.outputs.is_tag }}
          SHOULD_RELEASE: ${{ steps.version.outputs.should_release }}
          HAS_KEYSTORE: ${{ secrets.NOVA_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASS: ${{ secrets.NOVA_KEYSTORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS != '' }}
          HAS_KEY_PASS: ${{ secrets.NOVA_KEY_PASSWORD != '' }}
        run: |
          set -euo pipefail
          MISSING=()
          [[ "${HAS_KEYSTORE}" != "true" ]] && MISSING+=("NOVA_KEYSTORE_BASE64")
          [[ "${HAS_STORE_PASS}" != "true" ]] && MISSING+=("NOVA_KEYSTORE_PASSWORD")
          [[ "${HAS_KEY_ALIAS}" != "true" ]] && MISSING+=("NOVA_KEY_ALIAS")
          [[ "${HAS_KEY_PASS}" != "true" ]] && MISSING+=("NOVA_KEY_PASSWORD")

          if (( ${#MISSING[@]} > 0 )); then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            MSG="Missing required release signing secret(s): ${MISSING[*]}. Configure all 4 secrets in GitHub Repository Settings -> Secrets and variables -> Actions. Unsigned APKs cannot be installed on Android devices."
            {
              echo "### Missing Release Signing Secrets"
              echo "Android refuses to install unsigned APKs. Configure all 4 repository secrets under **Settings → Secrets and variables → Actions** before building a release APK:"
              echo "- \`NOVA_KEYSTORE_BASE64\`"
              echo "- \`NOVA_KEYSTORE_PASSWORD\`"
              echo "- \`NOVA_KEY_ALIAS\`"
              echo "- \`NOVA_KEY_PASSWORD\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::${MSG}"
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode production keystore
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          NOVA_KEYSTORE_BASE64: ${{ secrets.NOVA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$NOVA_KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/nova-release.jks"
          chmod 600 "${GITHUB_WORKSPACE}/nova-release.jks"

      - name: Build signed Release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          NOVA_KEYSTORE_PATH: nova-release.jks
          NOVA_KEYSTORE_PASSWORD: ${{ secrets.NOVA_KEYSTORE_PASSWORD }}
          NOVA_KEY_ALIAS: ${{ secrets.NOVA_KEY_ALIAS }}
          NOVA_KEY_PASSWORD: ${{ secrets.NOVA_KEY_PASSWORD }}
          NOVA_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          NOVA_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify signed Release APK, metadata & SHA-256
        id: package
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          OUT_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          OUT_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail

          APK_SOURCE=$(find app/build/outputs/apk/release -maxdepth 2 -name "*.apk" ! -name "*unsigned*" ! -name "*debug*" | head -n 1)
          if [[ -z "${APK_SOURCE}" || ! -f "${APK_SOURCE}" || ! -s "${APK_SOURCE}" ]]; then
            echo "::error::Signed release APK was not produced in app/build/outputs/apk/release. Refusing to continue."
            exit 1
          fi
          echo "Verified Gradle Release APK output path: ${APK_SOURCE}"

          unzip -t "${APK_SOURCE}" >/dev/null

          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name "apksigner" | sort -V | tail -n 1)
          if [[ -z "${APKSIGNER}" ]]; then
            echo "::error::apksigner not found in ANDROID_HOME/build-tools."
            exit 1
          fi
          "${APKSIGNER}" verify --min-sdk-version 26 --print-certs "${APK_SOURCE}"

          AAPT2=$(find "${ANDROID_HOME}/build-tools" -name "aapt2" | sort -V | tail -n 1)
          if [[ -n "${AAPT2}" ]]; then
            BADGING=$("${AAPT2}" dump badging "${APK_SOURCE}")
            echo "${BADGING}" | head -n 8
            if ! grep -q "package: name='com.novamusic.player'" <<< "${BADGING}"; then
              echo "::error::APK package name is not com.novamusic.player."
              exit 1
            fi
            if ! grep -q "versionCode='${OUT_VERSION_CODE}'" <<< "${BADGING}"; then
              echo "::error::APK versionCode does not match expected ${OUT_VERSION_CODE}."
              exit 1
            fi
            if ! grep -q "versionName='${OUT_VERSION_NAME}'" <<< "${BADGING}"; then
              echo "::error::APK versionName does not match expected ${OUT_VERSION_NAME}."
              exit 1
            fi
            if ! grep -q "sdkVersion:'26'" <<< "${BADGING}"; then
              echo "::error::APK minSdkVersion is not 26."
              exit 1
            fi
            if ! grep -q "targetSdkVersion:'35'" <<< "${BADGING}"; then
              echo "::error::APK targetSdkVersion is not 35."
              exit 1
            fi
            if grep -q "application-debuggable" <<< "${BADGING}"; then
              echo "::error::APK is marked debuggable! Refusing to publish a debuggable APK as a release."
              exit 1
            fi
            if grep -q "testOnly='-1'" <<< "${BADGING}"; then
              echo "::error::APK is marked testOnly! Refusing to publish an un-installable testOnly APK."
              exit 1
            fi
          fi

          APK_FILENAME="NOVA-MUSIC-v${OUT_VERSION_NAME}.apk"
          mkdir -p release-artifacts
          cp "${APK_SOURCE}" "release-artifacts/${APK_FILENAME}"

          SHA256=$(sha256sum "release-artifacts/${APK_FILENAME}" | awk '{print $1}')
          printf '%s  %s\n' "${SHA256}" "${APK_FILENAME}" > "release-artifacts/${APK_FILENAME}.sha256"
          (cd release-artifacts && sha256sum -c "${APK_FILENAME}.sha256")

          echo "apk_filename=${APK_FILENAME}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

          {
            echo "### Signed Release Artifact Verified"
            echo "- **APK File**: \`${APK_FILENAME}\`"
            echo "- **Gradle Output**: \`${APK_SOURCE}\`"
            echo "- **Version**: \`${OUT_VERSION_NAME}\` (\`versionCode: ${OUT_VERSION_CODE}\`)"
            echo "- **SHA-256**: \`${SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup keystore from runner
        if: always()
        shell: bash
        run: rm -f "${GITHUB_WORKSPACE}/nova-release.jks"

      - name: Upload signed Release APK artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-MUSIC-release-v${{ steps.version.outputs.version_name }}
          path: |
            release-artifacts/${{ steps.package.outputs.apk_filename }}
            release-artifacts/${{ steps.package.outputs.apk_filename }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.signing.outputs.ready == 'true' && steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: NOVA MUSIC ${{ steps.version.outputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-artifacts/${{ steps.package.outputs.apk_filename }}
            release-artifacts/${{ steps.package.outputs.apk_filename }}.sha256
          body: |
            ## NOVA MUSIC ${{ steps.version.outputs.tag_name }} (Build ${{ steps.version.outputs.version_code }})

            ### Integrity Verification
            - **APK File**: `${{ steps.package.outputs.apk_filename }}`
            - **SHA-256**: `${{ steps.package.outputs.sha256 }}`
            - **Direct Download**: `https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag_name }}/${{ steps.package.outputs.apk_filename }}`

            ### Website (`kz4manoff/Nova-Website`) `public/update.json` Configuration
            ```json
            {
              "latestVersion": "${{ steps.version.outputs.version_name }}",
              "versionCode": ${{ steps.version.outputs.version_code }},
              "apkUrl": "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag_name }}/${{ steps.package.outputs.apk_filename }}",
              "sha256": "${{ steps.package.outputs.sha256 }}",
              "releaseNotes": "See GitHub Release notes for NOVA MUSIC ${{ steps.version.outputs.tag_name }}.",
              "mandatoryUpdate": false,
              "minimumSupportedVersion": 1
            }
            ```

      - name: Verify published GitHub Release contains APK and SHA-256
        id: verify_release
        if: steps.signing.outputs.ready == 'true' && steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          APK_FILENAME: ${{ steps.package.outputs.apk_filename }}
        run: |
          set -euo pipefail
          REL_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}")

          APK_URL=$(python3 -c '
          import json, os, sys
          rel = json.loads(sys.stdin.read())
          assert not rel.get("draft"), "Published release must not be a draft."
          apk_name = os.environ["APK_FILENAME"]
          sha_name = apk_name + ".sha256"
          assets = {a["name"]: a for a in rel.get("assets", [])}
          assert apk_name in assets and assets[apk_name]["size"] > 0, f"Missing APK asset {apk_name}"
          assert sha_name in assets and assets[sha_name]["size"] > 0, f"Missing SHA-256 asset {sha_name}"
          print(assets[apk_name]["browser_download_url"])
          ' <<< "${REL_JSON}")

          echo "apk_url=${APK_URL}" >> "$GITHUB_OUTPUT"
          echo "Verified Public APK URL: ${APK_URL}"

      - name: Update website public/update.json on kz4manoff/Nova-Website
        if: steps.signing.outputs.ready == 'true' && steps.version.outputs.should_release == 'true'
        shell: bash
        env:
          NOVA_WEBSITE_TOKEN: ${{ secrets.NOVA_WEBSITE_TOKEN }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_URL: ${{ steps.verify_release.outputs.apk_url }}
          SHA256: ${{ steps.package.outputs.sha256 }}
          WEBSITE_REPO: kz4manoff/Nova-Website
          WEBSITE_PATH: public/update.json
          WEBSITE_BRANCH: main
        run: |
          set -euo pipefail
          if [[ -z "${NOVA_WEBSITE_TOKEN}" ]]; then
            echo "::warning::NOVA_WEBSITE_TOKEN secret is not configured. Skipping automatic update of ${WEBSITE_REPO}/${WEBSITE_PATH}; update it manually or add a fine-grained PAT secret named NOVA_WEBSITE_TOKEN with Contents read/write access on ${WEBSITE_REPO}."
            {
              echo "### Website Manifest Sync Skipped"
              echo "Add the \`NOVA_WEBSITE_TOKEN\` repository secret (Contents: Read & write on \`${WEBSITE_REPO}\`) to automatically push \`public/update.json\` and trigger Cloudflare Pages deployment on every release."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          API_URL="https://api.github.com/repos/${WEBSITE_REPO}/contents/${WEBSITE_PATH}"
          CURRENT_JSON=$(curl -fsSL \
            -H "Authorization: Bearer ${NOVA_WEBSITE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${API_URL}?ref=${WEBSITE_BRANCH}")

          PAYLOAD=$(python3 -c '
          import base64, json, os, sys
          meta = json.loads(sys.stdin.read())
          file_sha = meta["sha"]
          existing = {}
          if meta.get("content"):
              raw_existing = base64.b64decode(meta["content"]).decode("utf-8")
              existing = json.loads(raw_existing)

          version_name = os.environ["VERSION_NAME"]
          version_code = int(os.environ["VERSION_CODE"])
          manifest = {
              "latestVersion": version_name,
              "versionCode": version_code,
              "apkUrl": os.environ["APK_URL"],
              "sha256": os.environ["SHA256"],
              "releaseNotes": f"NOVA MUSIC v{version_name} (Build {version_code}) signed release.",
              "mandatoryUpdate": bool(existing.get("mandatoryUpdate", False)),
              "minimumSupportedVersion": int(existing.get("minimumSupportedVersion", 1)),
          }
          encoded = base64.b64encode((json.dumps(manifest, indent=2) + "\n").encode("utf-8")).decode("ascii")
          print(json.dumps({
              "message": f"chore: update update.json to v{version_name} (versionCode {version_code})",
              "content": encoded,
              "sha": file_sha,
              "branch": os.environ["WEBSITE_BRANCH"],
          }))
          ' <<< "${CURRENT_JSON}")

          curl -fsSL -X PUT \
            -H "Authorization: Bearer ${NOVA_WEBSITE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${API_URL}" > /dev/null

          echo "Updated ${WEBSITE_REPO}/${WEBSITE_PATH} for v${VERSION_NAME} (versionCode ${VERSION_CODE})."
          {
            echo "### Website Update Manifest Synced"
            echo "- Updated \`${WEBSITE_REPO}/${WEBSITE_PATH}\` on \`${WEBSITE_BRANCH}\` with \`v${VERSION_NAME}\` (\`versionCode: ${VERSION_CODE}\`)."
            echo "- Cloudflare Pages will automatically deploy \`https://nova-website-1tg.pages.dev/update.json\`."
          } >> "$GITHUB_STEP_SUMMARY"
